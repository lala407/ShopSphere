<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="775" viewBox="0 0 1300 775"><rect width="1300" height="775" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><text x="40" y="34" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#1f2937">图 4　下单事务时序（含「事务提交后才发信」）</text><rect x="24" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="90" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">浏览器</text><line x1="90" y1="96" x2="90" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="194" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="260" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">OrderController</text><line x1="260" y1="96" x2="260" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="384" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="450" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">OrderService</text><line x1="450" y1="96" x2="450" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="594" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="660" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">ProductRepository</text><line x1="660" y1="96" x2="660" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="814" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="880" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">MySQL</text><line x1="880" y1="96" x2="880" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1009" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="1075" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">OrderMailListener</text><line x1="1075" y1="96" x2="1075" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1149" y="66" width="132" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/><text x="1215" y="86" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#1e3a8a">QQ SMTP</text><line x1="1215" y1="96" x2="1215" y2="740" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="424" y="112" width="486" height="428" rx="8" fill="none" stroke="#a7f3d0" stroke-width="1.6" stroke-dasharray="7 6"/><text x="432" y="130" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#059669">@Transactional(rollbackFor = Exception.class)</text><path d="M 90 160 L 260 160" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="175.0" y="151" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">POST /order/create</text><path d="M 260 196 L 450 196" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="355.0" y="187" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">createOrder(userId, 收货信息…)</text><path d="M 450 232 L 660 232" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="555.0" y="223" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">findByUserIdOrderByIdDesc()</text><path d="M 660 262 L 880 262" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="770.0" y="253" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">SELECT cart_item JOIN product</text><path d="M 450 298 L 880 298" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="665.0" y="289" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">INSERT orders（status = CREATED）</text><path d="M 450 334 L 880 334" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="665.0" y="325" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">INSERT order_item（价格快照）</text><path d="M 450 370 L 660 370" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="555.0" y="361" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">deductStock(pid, qty)</text><path d="M 660 400 L 880 400" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="770.0" y="391" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">UPDATE product SET stock = stock - :qty</text><text x="770.0" y="417" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#6b7280">WHERE stock >= :qty；受影响行数 0 → 抛异常，整单回滚</text><path d="M 450 446 L 880 446" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="665.0" y="437" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">DELETE cart_item WHERE user_id = ?</text><path d="M 450 482 L 514 482 L 514 506 L 450 506" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/><text x="522" y="496" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" fill="#6b7280">publishEvent(OrderMailEvent)</text><text x="424" y="534" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#059669">COMMIT</text><path d="M 450 570 L 1075 570" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="762.5" y="561" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">AFTER_COMMIT → onOrderMail(event)</text><text x="762.5" y="587" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#6b7280">事务已提交；上面任一步抛异常都不会走到这里</text><path d="M 1075 612 L 1215 612" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="1145.0" y="603" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">JavaMailSender.send()</text><path d="M 1075 648 L 880 648" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="977.5" y="639" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">INSERT mail_log（REQUIRES_NEW）</text><text x="977.5" y="665" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#6b7280">独立事务：下单事务已结束，复用会静默不落库</text><path d="M 1075 700 L 260 700" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="667.5" y="691" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">返回（发信失败只打日志）</text><path d="M 260 730 L 90 730" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="175.0" y="721" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#1f2937">302 → /orders/{id}</text></svg>