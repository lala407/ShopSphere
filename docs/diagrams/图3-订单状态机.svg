<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460"><rect width="1120" height="460" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><text x="40" y="34" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#1f2937">图 3　订单状态机（菱形标注触发动作）</text><rect x="70" y="110" width="220" height="66" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.8"/><text x="180" y="150" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#1f2937">待付款 CREATED</text><rect x="330" y="110" width="220" height="66" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.8"/><text x="440" y="150" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#1f2937">已付款 PAID</text><rect x="590" y="110" width="220" height="66" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/><text x="700" y="150" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#1f2937">已发货 SHIPPED</text><rect x="850" y="110" width="220" height="66" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8" stroke-dasharray="7 6"/><text x="960" y="150" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#1f2937">已完成 COMPLETED</text><rect x="330" y="300" width="220" height="66" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.8"/><text x="440" y="340" text-anchor="middle" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#1f2937">已取消 CANCELLED</text><path d="M 290 143 L 330 143" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="294" y="132" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#6b7280">pay()</text><path d="M 550 143 L 590 143" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="552" y="132" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#6b7280">ship()</text><path d="M 810 143 L 850 143" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="790" y="132" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="11" fill="#6b7280">confirm()（未实现）</text><path d="M 180 176 L 180 250 L 360 250 L 360 300" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="196" y="242" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#6b7280">cancel()　回补库存</text><path d="M 440 176 L 440 300" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><text x="452" y="250" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12" fill="#6b7280">cancel()　回补库存</text><text x="70" y="400" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">库存扣减时点是「下单」而非「付款」——因此 CREATED / PAID 取消都要回补库存；SHIPPED 之后不允许取消（现实走退货，MVP 不做）。</text><text x="70" y="424" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">状态判断全部在 Service 层用 if 显式校验（非法流转抛 IllegalArgumentException），页面徽章按状态着色：待付款黄 / 已付款绿 / 已发货蓝 / 已取消灰。</text></svg>