ler）</text><text x="104" y="330" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">ProductController / CartController / OrderController</text><text x="104" y="347" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">UserController / AdminProduct·Order·Stats·LogController</text><rect x="90" y="386" width="380" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="104" y="410" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#0f172a">Service 层（@Service / @Transactional）</text><text x="104" y="428" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">OrderService（下单事务、付款、发货、取消）</text><text x="104" y="445" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">MailService / MailLogWriter（REQUIRES_NEW）</text><text x="104" y="462" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">AccessLogService</text><rect x="90" y="500" width="380" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><text x="104" y="524" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#0f172a">Repository 层（Spring Data JPA）</text><text x="104" y="542" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">8 个接口：JPQL + 方法名派生 + 条件 UPDATE</text><rect x="530" y="288" width="380" height="80" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/><text x="544" y="312" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#0f172a">应用事件 ApplicationEventPublisher</text><text x="544" y="330" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="12.5" fill="#6b7280">下单/付款/发货 → publishEvent(OrderMailEvent)</text><rect x="530" y="386" width="380" height="96" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/><text x="544" 