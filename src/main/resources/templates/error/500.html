<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('服务器开小差 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container text-center py-5">
    <h1 class="display-1 fw-bold text-muted">500</h1>
    <p class="lead mb-2">服务器出了点问题，请稍后再试</p>
    <!-- 开发期留个口子：页面上能看到异常摘要，正式环境应删掉这一行 -->

        <small th:text="${errorMessage}">异常信息</small>
    </p>
    <a href="/" class="btn btn-primary mt-3">返回首页</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
