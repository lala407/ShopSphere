<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('订单详情 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

    <!-- 付款失败（重复付款/状态不对）时 flash 回来的提示 -->
    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>
    <!-- [AI辅助 P1-3] 取消/确认收货成功的提示 -->
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">订单详情</h3>
        <a href="/orders" class="btn btn-outline-secondary btn-sm">返回订单列表</a>
    </div>


         <div class="card mb-4">
             <div class="card-body">
                 <div class="row">
                     <div class="col-md-6">
                         <p class="mb-1">订单号：<strong th:text="${order.orderNo}">单号</strong></p>
                         <p class="mb-1">下单时间：<span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span></p>
                         <p class="mb-1">状态：
                             <span class="badge bg-info" th:text="${order.status.label}">状态</span>
                         </p>
                     </div>
                     <div class="col-md-6">
                         <p class="mb-1">收货人：<span th:text="${order.receiverName}">姓名</span></p>
                         <p class="mb-1">电话：<span th:text="${order.receiverPhone}">电话</span></p>
                         <p class="mb-1">地址：<span th:text="${order.receiverAddress}">地址</span></p>
                         <p class="mb-1" th:if="${order.remark != null}">备注：<span th:text="${order.remark}">备注</span></p>
                     </div>
                 </div>
                <hr>
                <!-- ==================== [AI辅助 P1-4] 状态时间线 ====================
                     横向步骤条（纯 CSS，不引第三方库）：下单 → 付款 → 发货 → 完成。
                     每一步"走到没有"由对应的 *At 时间字段判断（有值 = 已到达），
                     与状态机的写入口一一对应：paidAt（pay）/ shippedAt（ship）/
                     completedAt（confirm，P1-3 新增）。已取消订单不渲染步骤条，
                     单独显示红色取消提示。 -->
                <style>
                    .order-steps { display: flex; text-align: center; }
                    .order-steps .step { flex: 1 1 0; position: relative; padding-top: 2px; }
                    .order-steps .dot { width: 14px; height: 14px; border-radius: 50%;
                                        background-color: #ced4da; margin: 0 auto 4px auto;
                                        position: relative; z-index: 1; }
                    .order-steps .step:not(:last-child)::after { content: '';
                                        position: absolute; top: 8px; left: 50%;
                                        width: 100%; height: 2px;
                                        background-color: #ced4da; z-index: 0; }
                    .order-steps .step.done .dot { background-color: #198754; }
                    .order-steps .step.done:not(:last-child)::after { background-color: #198754; }
                    .order-steps .lbl { font-size: 0.875rem; color: #6c757d; }
                    .order-steps .step.done .lbl { color: #198754; font-weight: 600; }
                    .order-steps .time { font-size: 0.75rem; color: #adb5bd; }
                </style>
                <div class="order-steps mb-2" th:unless="${order.status.name() == 'CANCELLED'}">
                    <div class="step done">
                        <div class="dot"></div>
                        <div class="lbl">下单</div>
                        <div class="time" th:text="${#temporals.format(order.createdAt, 'MM-dd HH:mm')}">时间</div>
                    </div>
                    <div class="step" th:classappend="${order.paidAt != null} ? 'done'">
                        <div class="dot"></div>
                        <div class="lbl">付款</div>
                        <div class="time" th:if="${order.paidAt != null}"
                             th:text="${#temporals.format(order.paidAt, 'MM-dd HH:mm')}">时间</div>
                    </div>
                    <div class="step" th:classappend="${order.shippedAt != null} ? 'done'">
                        <div class="dot"></div>
                        <div class="lbl">发货</div>
                        <div class="time" th:if="${order.shippedAt != null}"
                             th:text="${#temporals.format(order.shippedAt, 'MM-dd HH:mm')}">时间</div>
                    </div>
                    <div class="step" th:classappend="${order.completedAt != null} ? 'done'">
                        <div class="dot"></div>
                        <div class="lbl">完成</div>
                        <div class="time" th:if="${order.completedAt != null}"
                             th:text="${#temporals.format(order.completedAt, 'MM-dd HH:mm')}">时间</div>
                    </div>
                </div>
                <!-- 已取消订单：不画进度，直接红字说明 -->
                <div th:if="${order.status.name() == 'CANCELLED'}" class="text-danger small mb-2">
                    该订单已取消<span th:if="${order.cancelledAt != null}"
                        th:text="${'（' + #temporals.format(order.cancelledAt, 'yyyy-MM-dd HH:mm:ss') + '），占用库存已释放'}">，占用库存已释放</span>
                </div>
                <!-- 关键节点时间明细（与时间线呼应，方便截图进报告） -->
                <div class="small text-muted">
                    <span class="me-3" th:if="${order.paidAt != null}">付款时间：<span
                            th:text="${#temporals.format(order.paidAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span></span>
                    <span class="me-3" th:if="${order.shippedAt != null}">发货时间：<span
                            th:text="${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span></span>
                    <span class="me-3" th:if="${order.completedAt != null}">完成时间：<span
                            th:text="${#temporals.format(order.completedAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span></span>
                    <span class="me-3" th:if="${order.cancelledAt != null}">取消时间：<span
                            th:text="${#temporals.format(order.cancelledAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span></span>
                </div>
             </div>
         </div>

         <!-- ==================== [AI辅助 Day8] 邮件通知记录 ====================
              数据来源 mail_log 表：每封通知邮件发没发、发给谁、什么时候发的，
              页面直接显示，老师不登录邮箱也能看到"邮件确认"这条需求的落地证据。
              SENT/SKIPPED/FAILED 三种状态用不同颜色区分。 -->
         <div class="alert alert-light border small mb-4"
              th:if="${mailLogs != null and !mailLogs.isEmpty()}">
             <div class="fw-bold mb-1">邮件通知</div>
             <div th:each="m : ${mailLogs}">
                 <span class="text-muted" th:text="${m.type.label}">类型</span>：
                 <span th:if="${m.status.name() == 'SENT'}" class="text-success"
                       th:text="${'已发送至 ' + m.toEmail + '（' + #temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm') + '）'}">已发送</span>
                 <span th:if="${m.status.name() == 'SKIPPED'}" class="text-secondary"
                       th:text="${'未发送 —— ' + m.errorMessage}">未发送</span>
                 <span th:if="${m.status.name() == 'FAILED'}" class="text-danger"
                       th:text="${'发送失败 —— ' + m.errorMessage}">失败</span>
             </div>
         </div>

         <table class="table">
             <thead class="table-light">
             <tr>
                 <th>商品</th>
                 <th class="text-end">下单时单价</th>
                 <th class="text-center">数量</th>
                 <th class="text-end">小计</th>
             </tr>
             </thead>
             <tbody>
             <tr th:each="it : ${items}">
                 <td th:text="${it.productName}">商品名</td>
                 <td class="text-end">¥<span th:text="${it.productPrice}">0</span></td>
                 <td class="text-center" th:text="${it.quantity}">0</td>
                 <td class="text-end">¥<span th:text="${it.subtotal}">0</span></td>
             </tr>
             </tbody>
         </table>


         <div class="d-flex justify-content-between align-items-center border-top pt-3">
             <span class="text-muted">共 <span th:text="${items.size()}">0</span> 件商品</span>
             <div>
                 <span class="text-muted me-2">订单金额：</span>
                 <span class="text-danger fs-4 fw-bold">¥<span th:text="${order.totalAmount}">0</span></span>


                <form th:if="${order.status.name() == 'CREATED'}" method="post"
                      th:action="@{/orders/{id}/pay(id=${order.id})}" class="d-inline ms-3">
                    <button type="submit" class="btn btn-success btn-lg">模拟付款</button>
                </form>
                <!-- [AI辅助 P1-3] 用户只能取消待付款订单（已付款的取消收口到后台） -->
                <form th:if="${order.status.name() == 'CREATED'}" method="post"
                      th:action="@{/orders/{id}/cancel(id=${order.id})}" class="d-inline ms-2"
                      onsubmit="return confirm('取消订单将释放占用库存，确认取消？')">
                    <button type="submit" class="btn btn-outline-danger btn-lg">取消订单</button>
                </form>
                <!-- [AI辅助 P1-3] 确认收货：状态机 COMPLETED 的唯一入口 -->
                <form th:if="${order.status.name() == 'SHIPPED'}" method="post"
                      th:action="@{/orders/{id}/confirm(id=${order.id})}" class="d-inline ms-3">
                    <button type="submit" class="btn btn-primary btn-lg">确认收货</button>
                </form>
             </div>
         </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
