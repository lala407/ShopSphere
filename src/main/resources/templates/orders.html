<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('我的订单 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

    <h3 class="mb-4">我的订单</h3>


         <div th:if="${orders.isEmpty()}" class="text-center text-muted py-5">
             <p class="fs-5">还没有订单</p>
             <a href="/" class="btn btn-primary">去逛逛</a>
         </div>


    <table th:if="${!orders.isEmpty()}" class="table align-middle">
        <thead class="table-light">
        <tr>
            <th>订单号</th>
            <th>下单时间</th>
            <th class="text-end">金额</th>
            <th class="text-center">状态</th>
            <th class="text-center">操作</th>
        </tr>
        </thead>
        <tbody>

             <tr th:each="o : ${orders}">
                 <td><span th:text="${o.orderNo}">单号</span></td>
                 <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
                 <td class="text-end">¥<span th:text="${o.totalAmount}">0</span></td>
                 <td class="text-center">
                     <span class="badge"
                           th:classappend="${o.status.name() == 'CREATED'} ? 'bg-warning text-dark'
                                         : (${o.status.name() == 'PAID'} ? 'bg-success' : 'bg-secondary')"
                           th:text="${o.status.label}">状态</span>
                 </td>
                 <td class="text-center">
                     <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">查看详情</a>
                 </td>
             </tr>


        </tbody>
    </table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
