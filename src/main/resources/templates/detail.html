    <!-- [手写] 商品详情布局：左图右信息 -->
    <div class="row">
        <!-- 左栏：商品图 -->
        <div class="col-md-5">
            <img th:src="${product.imageUrl}" class="img-fluid rounded" alt="商品图">
        </div>

        <!-- 右栏：信息 -->
        <div class="col-md-7">
            <h3 th:text="${product.name}">商品名</h3>

            <p class="text-danger fs-4 fw-bold">
                ¥<span th:text="${product.price}">0</span>
            </p>

            <p class="text-muted">
                库存 <span th:text="${product.stock}">0</span> 件 ·
                已售 <span th:text="${product.sales}">0</span> 件
            </p>

            <p th:text="${product.description}">商品描述</p>

            <hr>

            <!-- 加入购物车（Day 4）：必须是 POST（会改数据），不能再用 GET 链接 -->
            <!-- [AI辅助] 表单骨架由 AI 提供，请读懂：productId 用 hidden 传，
                 quantity 固定 1（详情页暂不做数量选择器） -->
            <form method="post" action="/cart/add" class="d-inline">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="hidden" name="quantity" value="1">
                <button type="submit" class="btn btn-primary btn-lg">加入购物车</button>
            </form>
            <a href="/" class="btn btn-outline-secondary btn-lg">返回列表</a>
        </div>
    </div>
