<!--
  依赖的 model（AdminOrderController.detail 提供）：
    order —— Order
    items —— List<OrderItem>（价格快照）
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('订单详情 - 后台')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">
    <ul th:replace="~{fragments/admin-nav :: tabs('order')}"></ul>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">订单详情 <small class="text-muted" th:text="${order.orderNo}"></small></h4>
        <a href="/admin/order" class="btn btn-outline-secondary btn-sm">返回列表</a>
    </div>

    <div class="row">
        <!-- 左：订单与收货信息 -->
        <div class="col-md-5">
            <div class="card card-body shadow-sm mb-3">
                <p class="mb-2">状态：
                    <span class="badge"
                          th:classappend="${order.status.name() == 'PAID'} ? 'bg-primary' :
                                          (${order.status.name() == 'SHIPPED'} ? 'bg-info' :
                                          (${order.status.name() == 'COMPLETED'} ? 'bg-success' :
                                          (${order.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-warning text-dark')))"
                          th:text="${order.status.label}"></span>
                </p>
                <p class="mb-2">下单用户：<span th:text="${order.user.username}"></span></p>
                <p class="mb-2">收货人：<span th:text="${order.receiverName}"></span>
                    <span class="text-muted" th:text="${order.receiverPhone}"></span></p>
                <p class="mb-2">地址：<span th:text="${order.receiverAddress}"></span></p>
                <p class="mb-2" th:if="${order.remark != null and !order.remark.isEmpty()}">
                    备注：<span th:text="${order.remark}"></span></p>
                <hr>
                <p class="mb-1 text-muted"><small>下单：<span
                        th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></small></p>
                <p class="mb-1 text-muted" th:if="${order.paidAt != null}"><small>付款：<span
                        th:text="${#temporals.format(order.paidAt, 'yyyy-MM-dd HH:mm:ss')}"></span></small></p>
                <p class="mb-1 text-muted" th:if="${order.shippedAt != null}"><small>发货：<span
                        th:text="${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></small></p>
                <!-- [AI辅助 P1-3] 完成时间：确认收货（SHIPPED → COMPLETED）后才有值 -->
                <p class="mb-1 text-muted" th:if="${order.completedAt != null}"><small>完成：<span
                        th:text="${#temporals.format(order.completedAt, 'yyyy-MM-dd HH:mm:ss')}"></span></small></p>
                <p class="mb-1 text-muted" th:if="${order.cancelledAt != null}"><small>取消：<span
                        th:text="${#temporals.format(order.cancelledAt, 'yyyy-MM-dd HH:mm:ss')}"></span></small></p>
            </div>

            <!-- 操作按钮：按状态条件显示（与 OrderService 的状态判断前后呼应） -->
            <div class="d-flex gap-2 mb-3">
                <form th:if="${order.status.name() == 'PAID'}"
                      th:action="@{/admin/order/{id}/ship(id=${order.id})}" method="post">
                    <button type="submit" class="btn btn-primary"
                            onclick="return confirm('确认发货？')">发货</button>
                </form>
                <!-- [AI辅助 P1-3] 管理员代确认收货（买家没点时后台兜底，COMPLETED 入口） -->
                <form th:if="${order.status.name() == 'SHIPPED'}"
                      th:action="@{/admin/order/{id}/confirm(id=${order.id})}" method="post">
                    <button type="submit" class="btn btn-success"
                            onclick="return confirm('确认该订单已收货、订单完成？')">确认收货</button>
                </form>
                <form th:if="${order.status.name() == 'CREATED' or order.status.name() == 'PAID'}"
                      th:action="@{/admin/order/{id}/cancel(id=${order.id})}" method="post">
                    <button type="submit" class="btn btn-outline-danger"
                            onclick="return confirm('取消订单将回补库存，确认取消？')">取消订单</button>
                </form>
            </div>

            <!-- [AI辅助 Day8] 邮件通知记录：发货后确认"发货邮件到底发出去没有" -->
            <div class="alert alert-light border small" th:if="${mailLogs != null and !mailLogs.isEmpty()}">
                <div class="fw-bold mb-1">邮件通知</div>
                <div th:each="m : ${mailLogs}">
                    <span class="text-muted" th:text="${m.type.label}">类型</span>：
                    <span th:if="${m.status.name() == 'SENT'}" class="text-success"
                          th:text="${m.toEmail + '（' + #temporals.format(m.createdAt, 'MM-dd HH:mm') + '）'}">已发送</span>
                    <span th:if="${m.status.name() == 'SKIPPED'}" class="text-secondary"
                          th:text="${'未发送 —— ' + m.errorMessage}">未发送</span>
                    <span th:if="${m.status.name() == 'FAILED'}" class="text-danger"
                          th:text="${'发送失败 —— ' + m.errorMessage}">失败</span>
                </div>
            </div>
        </div>

        <!-- 右：明细（价格快照） -->
        <div class="col-md-7">
            <table class="table align-middle">
                <thead class="table-light">
                <tr><th>商品（下单时快照）</th><th>单价</th><th>数量</th><th>小计</th></tr>
                </thead>
                <tbody>
                <tr th:each="it : ${items}">
                    <td th:text="${it.productName}">商品名</td>
                    <td th:text="${'¥' + it.productPrice}">¥0</td>
                    <td th:text="${it.quantity}">1</td>
                    <td th:text="${'¥' + it.subtotal}">¥0</td>
                </tr>
                </tbody>
                <tfoot>
                <tr class="fw-bold">
                    <td colspan="3" class="text-end">订单总额</td>
                    <td class="text-danger" th:text="${'¥' + order.totalAmount}">¥0</td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
