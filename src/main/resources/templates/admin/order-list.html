<!--
  依赖的 model（AdminOrderController.list 提供）：
    orders   —— List<Order>
    statuses —— OrderStatus.values()（筛选下拉框）
    status   —— 当前选中状态（回显；null = 全部）
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('订单管理 - 后台')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">
    <ul th:replace="~{fragments/admin-nav :: tabs('order')}"></ul>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">订单管理</h4>
        <!-- 状态筛选：GET 表单，条件体现在 URL 上（/admin/order?status=PAID），可收藏可刷新 -->
        <form method="get" action="/admin/order" class="d-flex gap-2">
            <select name="status" class="form-select" style="width:auto">
                <option value="">全部状态</option>
                <!-- th:selected 回显：s 是枚举，status 也是枚举，直接 == 比较 -->
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                        th:selected="${s == status}"></option>
            </select>
            <button type="submit" class="btn btn-outline-primary">筛选</button>
        </form>
    </div>

    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>订单号</th><th>下单用户</th><th>收货人</th>
            <th>金额</th><th>状态</th><th>下单时间</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td><small th:text="${o.orderNo}">ORD...</small></td>
            <td th:text="${o.user.username}">用户</td>
            <td th:text="${o.receiverName}">收货人</td>
            <td th:text="${'¥' + o.totalAmount}">¥0</td>
            <td>
                <span class="badge"
                      th:classappend="${o.status.name() == 'PAID'} ? 'bg-primary' :
                                      (${o.status.name() == 'SHIPPED'} ? 'bg-info' :
                                      (${o.status.name() == 'COMPLETED'} ? 'bg-success' :
                                      (${o.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-warning text-dark')))"
                      th:text="${o.status.label}">状态</span>
            </td>
            <td th:text="${#temporals.format(o.createdAt, 'MM-dd HH:mm')}">时间</td>
            <td>
                <a th:href="@{/admin/order/{id}(id=${o.id})}"
                   class="btn btn-sm btn-outline-primary">详情</a>
            </td>
        </tr>
        <tr th:if="${orders.empty}">
            <td colspan="7" class="text-center text-muted py-4">没有符合条件的订单</td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
