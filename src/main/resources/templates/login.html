<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container" style="max-width: 420px">
    <div class="card shadow-sm p-4">
        <h3 class="mb-3">登录 ShopSphere</h3>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username"
                       name="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password"
                       name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>

        <div class="text-center mt-3">
            <small>没有账号？<a href="/register">去注册</a></small>
        </div>

        <!-- [P0-3] 测试账号提示：验收时不用再翻 README 就能登进来（截图清单 #07 要求） -->
        <hr class="my-3">
        <div class="text-muted small">
            <div class="fw-semibold mb-1">测试账号</div>
            <div>管理员：<code>admin</code> / <code>admin123</code></div>
            <div>普通用户：<code>demo</code> / <code>demo123</code></div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
