AI 辅助说明：本文件由 AI 辅助生成/修改
生成内容：checkout.html 骨架（页面结构 + 表单字段范式，商品清单为 TODO）
人工修改：收货表单字段、商品清单行由本人手写
审查状态：待人工审查
============================================================ -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('结算 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

    <h3 class="mb-4">确认订单</h3>

    <!-- 下单失败（库存不足/商品下架/收货信息不合规）时 Controller flash 回来的提示 -->
    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

    <div class="row">

        <!-- ==================== 左侧：收货表单 ==================== -->
        <div class="col-md-7">
            <div class="card mb-3">
                <div class="card-header">收货信息</div>
                <div class="card-body">

                    <!-- 整个表单包住"收货信息 + 商品清单 + 提交按钮"，
                         提交到 POST /order/create -->
                    <form method="post" action="/order/create">

                            <!-- [AI辅助 P1-5] 每个字段补 label（for 与 input id 一对一关联）：
                                 visual 上有文字标签，屏幕阅读器也能念出字段名，
                                 点击标签还能聚焦到输入框，和 register.html 的写法保持一致 -->
                            <div class="mb-3">
                                <label for="receiverName" class="form-label">
                                    收货人 <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="receiverName"
                                       name="receiverName" placeholder="请输入收货人姓名"
                                       autocomplete="name" required maxlength="50">
                            </div>

                            <div class="mb-3">
                                <label for="receiverPhone" class="form-label">
                                    手机号 <span class="text-danger">*</span>
                                </label>
                                <input type="tel" class="form-control" id="receiverPhone"
                                       name="receiverPhone" placeholder="11 位手机号，例如 13800001234"
                                       autocomplete="tel" required
                                       pattern="1[0-9]{10}" title="请输入 11 位手机号">
                                <div class="form-text">发货通知会通过短信/电话联系此号码</div>
                            </div>

                            <div class="mb-3">
                                <label for="receiverAddress" class="form-label">
                                    收货地址 <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="receiverAddress"
                                          name="receiverAddress" rows="2"
                                          placeholder="省 / 市 / 区 + 详细地址（不超过 255 字）"
                                          required maxlength="255"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="remark" class="form-label">订单备注</label>
                                <input type="text" class="form-control" id="remark"
                                       name="remark" placeholder="选填，例如「工作日白天送达」"
                                       maxlength="255">
                            </div>


                             <h5 class="mt-4 mb-3">商品清单</h5>
                             <ul class="list-group mb-3">
                                 <li class="list-group-item d-flex justify-content-between"
                                     th:each="item : ${items}">
                                     <span>
                                         <span th:text="${item.product.name}">商品名</span>
                                         <small class="text-muted" th:text="' × ' + ${item.quantity}"> × 1</small>
                                     </span>
                                     <span>¥<span th:text="${item.product.price * item.quantity}">0</span></span>
                                 </li>
                             </ul>
                             <div class="d-flex justify-content-end align-items-center mb-3">
                                 <span class="text-muted me-2">合计：</span>
                                 <span class="text-danger fs-4 fw-bold">¥<span th:text="${totalAmount}">0</span></span>
                             </div>


                             <div class="d-flex justify-content-between">
                                 <a href="/cart" class="btn btn-outline-secondary">返回购物车</a>
                                 <button type="submit" class="btn btn-primary btn-lg">提交订单</button>
                             </div>


                    </form>
                </div>
            </div>
        </div>

        <!-- 右侧提示区（AI 提供，静态） -->
        <div class="col-md-5">
            <div class="card bg-light">
                <div class="card-body">
                    <h6 class="card-title">下单说明</h6>
                    <ul class="small text-muted mb-0">
                        <li>提交后生成订单，状态为「待付款」</li>
                        <li>库存会在提交瞬间扣减，库存不足会整单失败</li>
                        <li>订单明细保存下单时的商品名与单价（价格快照）</li>
                        <li>本系统为模拟支付，不接入真实支付渠道</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
