<!-- th:fragment 声明一个"片段"，别的页面用 th:replace 引用它。

     用法（在你的页面 <head> 里）：
       <head th:replace="~{fragments/layout :: head('登录 - ShopSphere')}">
     其中 head('xxx') 的参数会替换片段里的 th:fragment="head(title)" 的 title。

     效果：所有页面共享同一套 CSS 引入，改一处全局生效。 -->
<head th:fragment="head(title)"
      xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">ShopSphere</title>
    <!-- Bootstrap 5：本地文件（static/css/bootstrap.min.css，5.3.3 原样存放）
         不用 CDN 的原因：校园网/答辩教室访问 jsdelivr 经常超时，一旦挂掉整站会变成无样式白页，
         截图和演示都救不回来。本地化后断网也能正常渲染。 -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">

    <!-- [P2-5] CSRF 令牌：由 CsrfTokenFilter 写进请求属性，这里落到 meta 供脚本读取。
         同步令牌方案，页面脚本给所有 POST 表单自动补隐藏域，服务端再逐个校验。
         攻击者的页面读不到本站 DOM，拿不到这个值，伪造的 POST 会被 403 拦下。 -->
    <meta name="_csrf" th:content="${_csrf}">
    <script>
        // 只补 POST 表单（GET 查询不改变状态，不需要令牌）
        document.addEventListener('DOMContentLoaded', function () {
            var meta = document.querySelector('meta[name="_csrf"]');
            if (!meta || !meta.content) return;
            document.querySelectorAll('form').forEach(function (form) {
                var method = (form.getAttribute('method') || 'get').toLowerCase();
                if (method !== 'post') return;
                if (form.querySelector('input[name="_csrf"]')) return;
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = '_csrf';
                input.value = meta.content;
                form.appendChild(input);
            });
        });
    </script>
</head>

<!-- 页脚片段：用法 <footer th:replace="~{fragments/layout :: footer}"></footer> -->
<footer th:fragment="footer" xmlns:th="http://www.thymeleaf.org"
        class="text-center text-muted py-4 mt-5 border-top">
    ShopSphere · 课程实验项目 · 2026
</footer>
