<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('注册 - ShopSphere')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container" style="max-width: 420px">
    <div class="card shadow-sm p-4">
        <h3 class="mb-3">注册 ShopSphere</h3>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form method="post" action="/register">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username"
                       name="username" placeholder="3-20 个字符" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password"
                       name="password" placeholder="6-20 个字符" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">邮箱（选填）</label>
                <input type="email" class="form-control" id="email"
                       name="email" placeholder="name@example.com">
            </div>

            <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>

        <div class="text-center mt-3">
            <small>已有账号？<a href="/login">去登录</a></small>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
