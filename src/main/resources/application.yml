# ============================================================
# AI 辅助说明：本文件由 AI 辅助生成/修改
# 生成内容：application.yml 基础配置
# 人工修改：数据库密码需学员自行填写（不要提交真实密码）
# 审查状态：待人工审查
# ============================================================

server:
  port: 8080
  # [AI辅助 2026-11-15] 只允许 Cookie 承载会话，关掉 URL 重写。
  # 默认情况下 Tomcat 在客户端还没有 Cookie 时会把 ;jsessionid=xxx 拼到每个链接后面
  # （首访首页时分类按钮会变成 /;jsessionid=ABC?cid=1），截图难看，会话 ID 也会泄露在地址栏。
  servlet:
    session:
      tracking-modes: cookie

spring:
  # Thymeleaf：关闭缓存，改模板立即生效（开发时）
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  # 数据源 —— 学员请把 password 改成自己本机 MySQL 的 root 密码
  datasource:
    # [手写] characterEncoding 必须是 Java 认识的名字（UTF-8），不能写 MySQL 术语 utf8mb4
    #        MySQL 端字符集由后面的 connectionCollation 保证 utf8mb4_general_ci
    # [手写] createDatabaseIfNotExist=true 让 MySQL 驱动自动建库，省得手动执行 CREATE DATABASE
    #        connectionCollation 保证新库用 utf8mb4_general_ci 字符集
    # [AI辅助] ${DB_URL:默认值}：本地开发用 localhost；Docker 容器里通过 -e DB_URL=... 注入
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopsphere?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_general_ci&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}   # 优先读环境变量 DB_PASSWORD，没有则默认 root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update               # 自动建表/更新表结构（开发方便）
    show-sql: true                    # 控制台打印 SQL，便于学习
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    # [AI辅助] data.sql 必须在 Hibernate 建表【之后】执行，否则 INSERT 时表还不存在
    defer-datasource-initialization: true

  # 数据库初始化
  sql:
    init:
      mode: always                    # 启动时自动执行 resources/db/ 下的 SQL

  # ============================================================
  # [AI辅助 Day8] 邮件服务（SMTP）
  # 用途：下单成功 / 付款成功 / 发货 三个节点给顾客发通知邮件
  # 账号密码一律从环境变量注入，仓库里不出现真实授权码：
  #   本地 PowerShell：$env:MAIL_USERNAME="you@qq.com"; $env:MAIL_PASSWORD="授权码"
  #   Docker：写在 .env 里，由 docker-compose 注入
  # 未配置 username 时不会报错——MailService 会把记录标成 SKIPPED 并跳过发送
  # ============================================================
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}            # 587 = STARTTLS；QQ/163 都支持
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}       # 注意是"授权码"，不是邮箱登录密码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # 三个超时都要设：否则 SMTP 卡住会把整个下单请求拖死
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 业务侧开关（和上面的 SMTP 账号分开：账号是"怎么发"，这里是"发不发"）
shopsphere:
  mail:
    enabled: ${MAIL_ENABLED:true}                  # 关掉后所有邮件都记为 SKIPPED
    from-name: ShopSphere 商城                      # 发件人显示名
    base-url: ${APP_BASE_URL:http://localhost:8080} # 邮件里的"查看订单"链接前缀

# 日志
logging:
  level:
    com.shopsphere: DEBUG
    org.hibernate.SQL: DEBUG
