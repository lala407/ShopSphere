# ============================================================
# AI 辅助说明：本文件由 AI 辅助生成/修改
# 生成内容：docker-compose 编排 —— app(Spring Boot) + mysql(MySQL 8) + 数据卷
# 人工修改：无
# 审查状态：待人工审查
# 设计要点：
#   1. 数据库密码从 .env 文件注入（.env 已在 .gitignore 排除，不入库）
#   2. mysql 健康检查 + app depends_on condition：保证 app 启动时 MySQL 已可接受连接
#   3. 数据卷 mysql-data：容器删了数据仍在（验收项"重启后数据不丢"）
#   4. MySQL 调小 buffer（对应计划书风险 R3：2G 内存服务器 OOM）
#   5. app 重启策略 unless-stopped：服务器重启后自动拉起
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      # 密码来自同目录 .env 文件（不提交到 Git）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    # 2G 内存服务器安全参数：关 performance_schema、调小 buffer pool
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shopsphere-net

  app:
    build: .
    container_name: shopsphere-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 容器内通过服务名 mysql 访问数据库（Compose 内置 DNS）
      DB_URL: jdbc:mysql://mysql:3306/shopsphere?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_general_ci&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy   # 等 MySQL 健康检查通过再启动 app
    networks:
      - shopsphere-net

volumes:
  mysql-data:    # 命名卷：数据持久化的关键，docker compose down 也不会删

networks:
  shopsphere-net:
